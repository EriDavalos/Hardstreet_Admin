name: hardstreet_admin
description: "HardStreet Admin - panel de administración con Drive de archivos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cross_file: ^0.3.4
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  web: ^1.1.0
  desktop_drop: ^0.8.4
  archive: ^4.3.0
  http: ^1.6.0
  http_parser: ^4.1.2
  flutter_local_notifications: ^18.0.1
  flutter_inappwebview: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Icono de la marca (el mismo `hs_icon.png` con el que se generan el icono de
  # Windows, el de Android y el del navegador): lo usa la marca de la app, así
  # que el panel, el login y la pantalla de carga enseñan LA MISMA pieza.
  assets:
    - assets/hs_icon.png
    # El SITIO REAL empaquetado (index.html, CSS, JS e imágenes): el editor
    # HTML del módulo "Sitio web" lo sirve en loopback para que la vista
    # previa sea EXACTAMENTE la web, no una maqueta de Flutter.
    - assets/site/
    - assets/site/gallery/assets/
    - assets/site/images/
